name: CI - Dev

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache: true

      - name: Run Go Test
        run: go test -race ./...

      - name: Run Go Lint
        run: go vet ./...

      - name: Run Go Build
        run: go build ./...
